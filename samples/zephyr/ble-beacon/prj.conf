# Hubble Network
CONFIG_HUBBLE_BLE_NETWORK=y

# Bluetooth dependencies
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Default BLE Tx power: 0 dBm
CONFIG_BT_CTLR_TX_PWR_0=y

CONFIG_MAIN_STACK_SIZE=2048

# Enable NVS to persist sequence number
CONFIG_FLASH=y
CONFIG_NVS=y